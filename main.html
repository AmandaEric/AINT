
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINT(Artificial Intelligence New Testing)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="aintIcon.png">
</head>

<body>
    <header>
        <a href="main.html" class="page-button">Student</a>
        <h1> Artificial Intelligent Testing Center </h1>
        <a href="admin.html" class="page-button">Admin</a>
    
    </header>

    <div class="main-container">

        <div class="controls">
            <div class="timer">0:00</div>


		<div class="avatar-container">
            <img id="ai-avatar" src="" alt="AI Avatar">
        </div>
        <button class="start">Start</button>
        </div>

        <div class="question-output">
            <p class="question-text">
                Select a question type to begin.
            </p>
        </div>

        <div class="response-container">
            <h3>Student Response</h3>

            <button class="listen" disabled>
                Start Listening
            </button>

            <textarea
                class="response"
                placeholder="Your spoken response will appear here..."
                disabled>
            </textarea>

            <button class="evaluate" disabled>
                Evaluate Response
            </button>

            <div class="evaluation">
                <p>AI evaluation will appear here.</p>
            </div>
        </div>

    </div>

    <div class="button-group">
        <button class="objective" disabled>Objective</button>
        <button class="semi" disabled>Semi-Objective</button>
        <button class="qualitative" disabled>Qualitative</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
